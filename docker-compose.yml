services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres-credit-analysis
    environment:
      POSTGRES_DB: credit_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
